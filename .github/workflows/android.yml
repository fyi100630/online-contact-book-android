name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # 發布：到 Actions → Android → Run workflow（選 main）。不需要推 tag，手機上就能按
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build (unsigned)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew --no-daemon :app:assembleRelease

  # 推 v3.0.0 這種 tag，或在 main 上手動按 Run workflow 時：
  # 用舊 App 的同一把金鑰簽章，建立「草稿」Release（版本號取自 app/build.gradle.kts 的 versionName）。
  # 確認沒問題後，到 GitHub 的 Releases 頁面按 Publish，舊 App 才會跳出更新通知。
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME 和 versionName $v 不一樣"; exit 1; }
          fi
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "::error::v$v 已經有 Release 了（要發新版請先把 versionCode / versionName 加大）"; exit 1
          fi
          echo "TAG=v$v" >> "$GITHUB_ENV"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "缺少 secrets.KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Signature must match the old app (so users can update in place)
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          new=app/build/outputs/apk/release/app-release.apk
          curl -fsSL -o old.apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/v2.0.0/app-release.apk"
          cert() { "$apksigner" verify --print-certs "$1" | grep -m1 'SHA-256 digest' | awk '{print $NF}'; }
          echo "old: $(cert old.apk)"; echo "new: $(cert "$new")"
          [ -n "$(cert "$new")" ] && [ "$(cert old.apk)" = "$(cert "$new")" ] || { echo "簽章和 v2.0.0 不同，舊 App 無法直接更新"; exit 1; }
          rm -f old.apk "$RUNNER_TEMP/release.jks"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk \
            --draft --title "$TAG" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
