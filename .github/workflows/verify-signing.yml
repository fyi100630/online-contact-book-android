name: Verify signing key

# 只驗證、不發布：設好四個 Secret 之後，到 Actions 頁面按「Run workflow」。
# 會檢查密碼、別名，以及簽章是不是和 v2.0.0 同一把。不會印出任何密碼。
on: workflow_dispatch

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Verify
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::還沒有設定 Secret：$v"; exit 1; }
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks" || { echo "::error::KEYSTORE_BASE64 不是正確的 base64"; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/old.apk" "https://github.com/${GITHUB_REPOSITORY}/releases/download/v2.0.0/app-release.apk"
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          scripts/verify-signing.sh "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/old.apk" "$apksigner"
          rm -f "$RUNNER_TEMP/release.jks"
